name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://andrewlandry-com.andrewlandry.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy static site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed page
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Verifying deployment (attempt $attempt/5)"
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              https://andrewlandry-com.andrewlandry.workers.dev/ \
              --output /tmp/deployed-index.html && \
              cmp --silent dist/index.html /tmp/deployed-index.html; then
              exit 0
            fi
            sleep 5
          done
          echo "The deployed page does not match this build."
          exit 1
