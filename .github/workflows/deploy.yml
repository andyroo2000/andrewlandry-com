name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://andrewlandry.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Deploy static site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed page
        run: |
          for site_url in https://andrewlandry.com/ https://www.andrewlandry.com/; do
            verified=false
            for attempt in 1 2 3 4 5; do
              echo "Verifying $site_url (attempt $attempt/5)"
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
                "$site_url" --output /tmp/deployed-index.html && \
                cmp --silent dist/index.html /tmp/deployed-index.html; then
                verified=true
                break
              fi
              sleep 5
            done
            if [ "$verified" != true ]; then
              echo "The deployed page at $site_url does not match this build."
              exit 1
            fi
          done
